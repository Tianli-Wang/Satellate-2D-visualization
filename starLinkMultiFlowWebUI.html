<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Starlink 多流路由可视化</title>
    <style>
        :root {
            --panel-width: 340px;
            --primary: #2563eb;
            --border: #dbe3ef;
            --muted: #64748b;
            --panel-bg: rgba(255, 255, 255, 0.97);
        }

        * { box-sizing: border-box; }
        html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
        body { color: #1e293b; background: #f8fafc; font-family: "Segoe UI", "Microsoft YaHei", sans-serif; }
        button, input { font: inherit; }

        #canvas-container { width: 100vw; height: 100vh; cursor: grab; }
        #canvas-container.dragging { cursor: grabbing; }
        #topoCanvas { display: block; width: 100%; height: 100%; }

        #sidebar {
            position: fixed;
            z-index: 20;
            inset: 0 auto 0 0;
            width: var(--panel-width);
            background: var(--panel-bg);
            border-right: 1px solid var(--border);
            box-shadow: 8px 0 30px rgba(15, 23, 42, 0.12);
            transform: translateX(0);
            transition: transform 220ms ease;
        }
        #sidebar.collapsed { transform: translateX(-100%); }
        .sidebar-content { height: 100%; padding: 18px; overflow-y: auto; }
        .sidebar-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
        .sidebar-title { margin: 0; font-size: 19px; }
        .sidebar-subtitle { margin: 3px 0 0; color: var(--muted); font-size: 11px; }
        .icon-btn { border: 0; background: transparent; color: #64748b; cursor: pointer; font-size: 22px; }

        #toggle-btn {
            position: fixed; z-index: 21; top: 14px; left: 14px;
            padding: 8px 12px; border: 1px solid var(--border); border-radius: 8px;
            color: #334155; background: #fff; box-shadow: 0 4px 16px rgba(15, 23, 42, 0.12); cursor: pointer;
        }
        #sidebar:not(.collapsed) ~ #toggle-btn { opacity: 0; pointer-events: none; }

        .section { padding-top: 14px; margin-top: 14px; border-top: 1px solid #e8edf4; }
        .section:first-of-type { padding-top: 0; margin-top: 0; border-top: 0; }
        .section-title { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; color: #475569; font-size: 11px; font-weight: 700; letter-spacing: 0.06em; }
        .field-label { display: block; margin: 8px 0 4px; color: var(--muted); font-size: 11px; }
        .text-input { width: 100%; padding: 7px 9px; border: 1px solid #cbd5e1; border-radius: 6px; color: #1e293b; background: #fff; font-size: 12px; }
        .inline { display: flex; gap: 7px; }
        .inline .text-input { flex: 1; min-width: 0; }

        .btn { padding: 7px 10px; border: 0; border-radius: 6px; color: #fff; background: var(--primary); cursor: pointer; font-size: 12px; font-weight: 600; }
        .btn:hover { filter: brightness(0.94); }
        .btn.secondary { color: #475569; background: #e2e8f0; }
        .btn.success { background: #16a34a; }
        .btn.danger { background: #dc2626; }
        .button-row { display: flex; gap: 7px; margin-top: 9px; }
        .button-row .btn { flex: 1; }

        #timeDisplay { margin-top: 10px; padding: 9px; border-radius: 6px; color: #86efac; background: #172033; text-align: center; font: 700 12px Consolas, monospace; }
        #timeSlider { width: 100%; margin-top: 10px; accent-color: var(--primary); }

        .drop-zone { padding: 12px; border: 1px dashed #94a3b8; border-radius: 8px; color: #64748b; background: #f8fafc; text-align: center; font-size: 11px; }
        .drop-zone.dragover { border-color: var(--primary); color: var(--primary); background: #eff6ff; }
        #folderInput { width: 100%; margin-top: 8px; font-size: 11px; }
        #loadingStatus { min-height: 17px; margin-top: 7px; color: #b45309; font-size: 11px; }

        .server-directory-row { display: flex; gap: 7px; margin-top: 8px; }
        .server-directory-row .text-input { flex: 1; min-width: 0; }
        #directoryDialog { width: min(620px, calc(100vw - 32px)); padding: 0; border: 0; border-radius: 10px; box-shadow: 0 18px 60px rgba(15, 23, 42, 0.3); }
        #directoryDialog::backdrop { background: rgba(15, 23, 42, 0.45); }
        .directory-dialog-content { padding: 16px; }
        .directory-dialog-header { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
        .directory-dialog-title { margin: 0; font-size: 16px; }
        #serverDirectoryCurrent { margin: 10px 0; padding: 8px; border-radius: 6px; color: #475569; background: #f1f5f9; font: 11px/1.45 Consolas, monospace; overflow-wrap: anywhere; }
        #serverDirectoryList { max-height: 52vh; overflow-y: auto; border: 1px solid #e2e8f0; border-radius: 7px; }
        .directory-entry { display: block; width: 100%; padding: 9px 11px; border: 0; border-bottom: 1px solid #edf2f7; color: #334155; background: #fff; text-align: left; cursor: pointer; font-size: 12px; }
        .directory-entry:last-child { border-bottom: 0; }
        .directory-entry:hover { background: #eff6ff; }
        .directory-dialog-actions { display: flex; justify-content: flex-end; gap: 7px; margin-top: 12px; }

        .flow-actions { display: flex; gap: 5px; }
        .flow-actions button { padding: 2px 7px; border: 1px solid #cbd5e1; border-radius: 5px; color: #475569; background: #fff; cursor: pointer; font-size: 10px; }
        #flowList { display: grid; gap: 7px; }
        .empty { padding: 13px; border-radius: 7px; color: #94a3b8; background: #f8fafc; text-align: center; font-size: 11px; }
        .flow-item { padding: 9px; border: 1px solid #e2e8f0; border-radius: 8px; background: #fff; }
        .flow-main { display: grid; grid-template-columns: auto 24px 1fr auto; gap: 7px; align-items: center; }
        .flow-color { width: 24px; height: 22px; padding: 0; border: 0; border-radius: 4px; cursor: pointer; }
        .flow-name { overflow: hidden; font-size: 12px; font-weight: 700; text-overflow: ellipsis; white-space: nowrap; }
        .flow-state { color: #16a34a; font-size: 10px; }
        .flow-state.outage { color: #dc2626; }
        .flow-detail { margin-top: 5px; overflow: hidden; color: #64748b; font-size: 10px; text-overflow: ellipsis; white-space: nowrap; }

        /* 方法对比卡片同时承担图例和统计信息的作用：左侧色条对应地图上的路径颜色。 */
        #comparisonList { display: grid; gap: 7px; margin-top: 8px; }
        .comparison-item { padding: 8px; border: 1px solid #e2e8f0; border-left: 4px solid var(--method-color); border-radius: 7px; background: #fff; }
        .comparison-main { display: grid; grid-template-columns: auto 24px 1fr auto; gap: 7px; align-items: center; }
        .comparison-name { overflow: hidden; font-size: 11px; font-weight: 700; text-overflow: ellipsis; white-space: nowrap; }
        .comparison-path { margin-top: 5px; color: #64748b; font: 10px/1.45 Consolas, "Microsoft YaHei", monospace; overflow-wrap: anywhere; }
        .comparison-summary { margin-top: 7px; padding: 7px; border-radius: 6px; color: #475569; background: #f8fafc; font-size: 10px; line-height: 1.5; }
        .status-same { color: #16a34a; }
        .status-different { color: #d97706; }
        .status-outage { color: #dc2626; }

        .legend { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; color: #64748b; font-size: 11px; }
        .legend-item { display: flex; align-items: center; gap: 7px; }
        .line-sample { width: 22px; height: 2px; background: #7c8da6; }
        .line-sample.dashed { height: 0; border-top: 2px dashed #7c3aed; background: transparent; }

        #groundStationControls { margin: 8px 0 10px; }
        #groundStationControls.disabled #groundStationPairList { opacity: 0.48; pointer-events: none; }
        #groundStationPairList { display: grid; gap: 6px; margin-top: 7px; }
        .ground-pair-item { padding: 7px 8px; border: 1px solid #e2e8f0; border-radius: 6px; background: #f8fafc; }
        .ground-pair-label { display: flex; align-items: center; gap: 7px; color: #334155; font-size: 11px; font-weight: 700; cursor: pointer; }
        .ground-pair-stations { margin: 4px 0 0 22px; color: #64748b; font-size: 10px; line-height: 1.4; }
        #groundStationFileInput { width: 100%; margin-top: 5px; font-size: 10px; }
        #groundStationStatus { min-height: 15px; margin-top: 5px; color: #64748b; font-size: 10px; line-height: 1.4; }

        #tooltip { position: fixed; z-index: 30; display: none; max-width: 260px; padding: 7px 10px; border: 1px solid #334155; border-radius: 6px; color: #fff; background: rgba(15, 23, 42, 0.92); pointer-events: none; font-size: 11px; }

        @media (max-width: 600px) { :root { --panel-width: min(88vw, 340px); } }
    </style>
</head>

<body>
    <aside id="sidebar">
        <div class="sidebar-content">
            <header class="sidebar-header">
                <div><h1 class="sidebar-title">Starlink 多流路由</h1><p class="sidebar-subtitle">连续世界地图 · 多源多宿同步显示</p></div>
                <button class="icon-btn" type="button" onclick="toggleSidebar()" aria-label="收起侧栏">×</button>
            </header>

            <section class="section">
                <div class="section-title">卫星搜索</div>
                <div class="inline">
                    <input id="inpSearch" class="text-input" type="text" placeholder="例如：100 或 STARLINK_100">
                    <button class="btn" type="button" onclick="doSearch()">定位</button>
                </div>
            </section>

            <section class="section">
                <div class="section-title">星座构型</div>
                <select id="constellationSelect" class="text-input" aria-label="选择星座构型">
                    <option value="stk_1584">当前 STK 数据：72 × 22（1584 星）</option>
                    <option value="legacy_6080">YAML 预期构型：190 × 32（6080 星）</option>
                </select>
                <div id="constellationInfo" style="margin-top:7px; color:#64748b; font-size:10px; line-height:1.5"></div>
                <div id="constellationStatus" style="margin-top:5px; min-height:15px; font-size:10px"></div>
            </section>

            <section class="section">
                <div class="section-title">仿真时间</div>
                <label class="field-label" for="inpStart">开始时间</label>
                <input id="inpStart" class="text-input" value="27 Feb 2025 00:00:00.000">
                <label class="field-label" for="inpStop">结束时间</label>
                <input id="inpStop" class="text-input" value="27 Feb 2025 01:00:00.000">
                <button class="btn secondary" type="button" onclick="applyTimeSettings()" style="width:100%; margin-top:8px">应用并重置</button>
                <div id="timeDisplay">WAITING...</div>
                <input id="timeSlider" type="range" min="0" value="0" step="1" aria-label="仿真时间轴">
                <div class="button-row">
                    <button class="btn secondary" type="button" onclick="changeTime(-30)">−30 秒</button>
                    <button class="btn secondary" type="button" onclick="changeTime(-5)">−5 秒</button>
                    <button class="btn success" id="btnPlay" type="button" onclick="togglePlay()">播放</button>
                    <button class="btn secondary" type="button" onclick="changeTime(5)">+5 秒</button>
                    <button class="btn secondary" type="button" onclick="changeTime(30)">+30 秒</button>
                </div>
            </section>

            <section class="section">
                <div class="section-title">载入多流路径</div>
                <label class="field-label" for="methodNameInput">方法名称（可选）</label>
                <input id="methodNameInput" class="text-input" type="text" placeholder="留空时从 flow_* 的上级目录推断">
                <div id="dropZone" class="drop-zone">
                    选择本地包含 flow_000、flow_001… 的方法目录<br>也支持将一个或多个 CSV 文件直接拖到此处
                    <input id="folderInput" type="file" webkitdirectory directory multiple accept=".csv">
                </div>
                <label class="field-label" for="serverDirectoryPath">服务器目录（需使用 serve_webui.py 启动）</label>
                <div class="server-directory-row">
                    <input id="serverDirectoryPath" class="text-input" type="text" placeholder="点击浏览服务器目录" readonly>
                    <button id="browseServerDirectoryButton" class="btn secondary" type="button">浏览</button>
                </div>
                <button id="loadServerDirectoryButton" class="btn" type="button" style="width:100%; margin-top:7px" disabled>载入服务器目录</button>
                <div id="loadingStatus"></div>
            </section>

            <section id="methodSection" class="section" hidden>
                <div class="section-title">
                    <span>已载入方法 <span id="methodCount"></span></span>
                    <span class="flow-actions"><button type="button" onclick="clearLoadedMethods()">清空</button></span>
                </div>
                <label class="field-label" for="activeMethodSelect">普通模式显示的方法</label>
                <select id="activeMethodSelect" class="text-input" aria-label="普通模式显示的方法"></select>
            </section>

            <section id="comparisonSection" class="section" hidden>
                <div class="section-title">同一条流的跨方法对比</div>
                <label style="display:flex; align-items:center; gap:8px; color:#475569; font-size:12px; cursor:pointer">
                    <input id="comparisonToggle" type="checkbox">
                    <span>启用路径叠加对比</span>
                </label>
                <label class="field-label" for="comparisonFlowSelect">要对比的流</label>
                <select id="comparisonFlowSelect" class="text-input" aria-label="要对比的流"></select>
                <div id="comparisonSummary" class="comparison-summary">至少载入两个方法后即可对比。</div>
                <div id="comparisonList"></div>
            </section>

            <section class="section">
                <div class="section-title">
                    <span>流显示控制 <span id="flowCount"></span></span>
                    <span class="flow-actions"><button type="button" onclick="setAllFlowsVisible(true)">全部打开</button><button type="button" onclick="setAllFlowsVisible(false)">全部关闭</button></span>
                </div>
                <div id="flowList"><div class="empty">尚未载入路径数据</div></div>
            </section>

            <section class="section">
                <div class="section-title">图例与操作</div>
                <label style="display:flex; align-items:center; gap:8px; margin-bottom:10px; color:#475569; font-size:12px; cursor:pointer">
                    <!-- 默认不勾选，因此页面初次打开时不会显示任何地面站元素。 -->
                    <input id="groundStationToggle" type="checkbox">
                    <span>显示地面站</span>
                </label>
                <div id="groundStationControls" class="disabled">
                    <div class="field-label">按地面站对显示</div>
                    <div id="groundStationPairList"></div>
                    <label class="field-label" for="groundStationFileInput">载入自定义地面站 CSV</label>
                    <input id="groundStationFileInput" type="file" accept=".csv">
                    <div id="groundStationStatus"></div>
                </div>
                <div class="legend">
                    <div class="legend-item"><span class="line-sample"></span>轨道内链路</div>
                    <div class="legend-item"><span class="line-sample dashed"></span>端点接入链路</div>
                    <div class="legend-item"><span>●</span>普通卫星</div>
                    <div class="legend-item"><span>◎</span>流内卫星</div>
                    <div class="legend-item"><span>▲</span>流的源端点</div>
                    <div class="legend-item"><span>◆</span>流的宿端点</div>
                </div>
                <p style="margin:9px 0 0; color:#94a3b8; font-size:10px; line-height:1.5">拖动平移，滚轮缩放。地图会在水平方向循环，跨越 ±180° 的路径始终连续。</p>
            </section>
        </div>
    </aside>

    <button id="toggle-btn" type="button" onclick="toggleSidebar()">☰ 菜单</button>
    <dialog id="directoryDialog">
        <div class="directory-dialog-content">
            <div class="directory-dialog-header">
                <h2 class="directory-dialog-title">选择服务器目录</h2>
                <button id="closeDirectoryDialogButton" class="icon-btn" type="button" aria-label="关闭">×</button>
            </div>
            <div id="serverDirectoryCurrent">正在读取…</div>
            <div id="serverDirectoryList"></div>
            <div class="directory-dialog-actions">
                <button id="cancelDirectoryButton" class="btn secondary" type="button">取消</button>
                <button id="selectDirectoryButton" class="btn" type="button">选择当前目录</button>
            </div>
        </div>
    </dialog>
    <div id="tooltip"></div>
    <main id="canvas-container"><canvas id="topoCanvas"></canvas></main>

    <script>
        "use strict";

        // ============================== 星座与轨道常量 ==============================
        // 这里只保留项目内有明确依据的固定构型：当前 STK 文件实际包含 1584 颗卫星，
        // preprocess/env YAML 则仍把预期规模写成 6080。两者不能共用同一个编号映射。
        const CONSTELLATION_PRESETS = {
            stk_1584: {
                name: "当前 STK 数据",
                planes: 72,
                satsPerPlane: 22,
                phaseFactor: 17,
                inclinationDeg: 53,
                altitudeKm: 550,
                evidence: "匹配 sat_state_m.npy 的 1584 颗卫星及原 walker_2d_mesh.html"
            },
            legacy_6080: {
                name: "YAML 预期构型",
                planes: 190,
                satsPerPlane: 32,
                phaseFactor: 17,
                inclinationDeg: 53,
                altitudeKm: 550,
                evidence: "匹配 configs/env.yaml、configs/preprocess.yaml 中的 6080 配置"
            }
        };
        // 当前真实数据是 72×22，因此页面启动时必须默认选择 stk_1584。
        let constellation = CONSTELLATION_PRESETS.stk_1584;
        const EARTH_RADIUS_KM = 6378.137;
        const EARTH_MU = 398600.4418;
        const EARTH_ROTATION = 7.2921159e-5;

        // 世界底图使用 2:1 等经纬投影。横向是周期坐标，纵向不是周期坐标。
        const BASE_WORLD_WIDTH = 2000;
        const BASE_WORLD_HEIGHT = 1000;
        const FLOW_COLORS = ["#e11d48", "#7c3aed", "#0891b2", "#ea580c", "#16a34a", "#2563eb", "#c026d3", "#65a30d", "#dc2626", "#0d9488"];

        // 默认配置与 AddGroundStationAccess.py 保持一致。aliases 用于兼容项目历史
        // 路由文件中的 Beijing_Source / Brasilia_Target 命名。
        let groundStations = [
            { pairName: "Beijing-Brasilia", role: "source", name: "Beijing", aliases: ["Beijing_Source"], latDeg: 39.9042, lonDeg: 116.4074 },
            { pairName: "Beijing-Brasilia", role: "target", name: "Brasilia", aliases: ["Brasilia_Target"], latDeg: -15.7975, lonDeg: -47.8919 },
            { pairName: "NewYork-London", role: "source", name: "NewYork", aliases: ["NewYork_Source", "New_York"], latDeg: 40.7128, lonDeg: -74.0060 },
            { pairName: "NewYork-London", role: "target", name: "London", aliases: ["London_Target"], latDeg: 51.5074, lonDeg: -0.1278 }
        ];
        const groundStationPairVisibility = new Map();

        function prepareGroundStations(stations, preserveVisibility = true) {
            const previousVisibility = preserveVisibility ? new Map(groundStationPairVisibility) : new Map();
            groundStationPairVisibility.clear();
            stations.forEach(gs => {
                gs.lat = gs.latDeg * Math.PI / 180;
                gs.lon = gs.lonDeg * Math.PI / 180;
                gs.aliases = Array.isArray(gs.aliases) ? gs.aliases : [];
                if (!groundStationPairVisibility.has(gs.pairName)) {
                    groundStationPairVisibility.set(gs.pairName, previousVisibility.get(gs.pairName) ?? true);
                }
            });
        }
        prepareGroundStations(groundStations, false);

        // ============================== 页面全局状态 ==============================
        const canvas = document.getElementById("topoCanvas");
        const ctx = canvas.getContext("2d");
        const tooltip = document.getElementById("tooltip");
        const container = document.getElementById("canvas-container");
        const mapImage = new Image();
        mapImage.src = "./map.jpg";

        let viewportWidth = 0;
        let viewportHeight = 0;
        let deviceScale = 1;
        let startTime = new Date();
        let stopTime = new Date();
        let currentTime = new Date();
        let satellites = [];
        // methodMap 保存所有已经载入的方法；flowMap 始终指向普通模式当前选中方法的流集合，
        // 这样既能新增跨方法对比，又不必破坏原有的流列表、显隐控制和绘图逻辑。
        let methodMap = new Map();
        let flowMap = new Map();
        let activeMethodId = "";
        let importBatchNumber = 0;
        const comparisonState = { enabled: false, flowId: "" };
        let searchedSatId = null;
        let hoveredObject = null;
        // 地面站默认关闭；只有用户主动打开开关后才绘制标记、接入链路并参与命中检测。
        let showGroundStations = false;
        let isPlaying = false;
        let playTimer = null;

        const view = { scale: 1, offsetX: 0, offsetY: 0, dragging: false, lastX: 0, lastY: 0 };

        // ============================== 基础 UI 与时间控制 ==============================
        function toggleSidebar() { document.getElementById("sidebar").classList.toggle("collapsed"); }

        function constellationTotal() {
            return constellation.planes * constellation.satsPerPlane;
        }

        function renderConstellationInfo() {
            const total = constellationTotal();
            document.getElementById("constellationInfo").innerHTML =
                `<strong>${escapeHTML(constellation.name)}</strong><br>` +
                `${constellation.planes} 个轨道面 × 每面 ${constellation.satsPerPlane} 星 = ${total} 星<br>` +
                `倾角 ${constellation.inclinationDeg}° · 高度 ${constellation.altitudeKm} km · 相位因子 ${constellation.phaseFactor}<br>` +
                escapeHTML(constellation.evidence);
        }

        function updateConstellationCompatibility() {
            const status = document.getElementById("constellationStatus");
            if (!methodMap.size) {
                status.textContent = "载入路径后会自动检查卫星编号范围。";
                status.style.color = "#64748b";
                return;
            }
            let maximumId = 0;
            // 对所有已载入方法做兼容性检查，避免普通模式只选中编号较小的方法时漏报越界路径。
            methodMap.forEach(method => method.flows.forEach(flow => flow.timeline.forEach(route => {
                    route.ids.forEach(id => { maximumId = Math.max(maximumId, id); });
                    maximumId = Math.max(maximumId, parseSatelliteId(route.source) || 0, parseSatelliteId(route.target) || 0);
                })));
            const total = constellationTotal();
            if (maximumId > total) {
                status.textContent = `不匹配：路径最大编号 ${maximumId}，当前构型只有 ${total} 颗卫星。`;
                status.style.color = "#dc2626";
            } else {
                status.textContent = `编号检查通过：路径最大编号 ${maximumId} / 构型容量 ${total}。`;
                status.style.color = "#16a34a";
            }
        }

        function applyConstellationPreset(presetId) {
            const preset = CONSTELLATION_PRESETS[presetId];
            if (!preset) return;
            constellation = preset;
            // 搜索目标超出新构型范围时主动清除，避免留下一个无法绘制的旧标记。
            if (searchedSatId && searchedSatId > constellationTotal()) searchedSatId = null;
            renderConstellationInfo();
            updateConstellationCompatibility();
            updateFrame();
        }

        function parseDateString(value) {
            const parsed = new Date(value.trim());
            return Number.isNaN(parsed.getTime()) ? null : parsed;
        }

        function applyTimeSettings() {
            const nextStart = parseDateString(document.getElementById("inpStart").value);
            const nextStop = parseDateString(document.getElementById("inpStop").value);
            if (!nextStart || !nextStop) { alert("请输入有效的开始和结束时间。"); return; }
            if (nextStop <= nextStart) { alert("结束时间必须晚于开始时间。"); return; }

            startTime = nextStart;
            stopTime = nextStop;
            currentTime = new Date(startTime);
            const slider = document.getElementById("timeSlider");
            slider.max = String((stopTime - startTime) / 1000);
            slider.value = "0";
            updateFrame();
        }

        function formatDate(date) {
            const day = String(date.getDate()).padStart(2, "0");
            const month = date.toLocaleString("en-US", { month: "short" });
            const year = date.getFullYear();
            const h = String(date.getHours()).padStart(2, "0");
            const m = String(date.getMinutes()).padStart(2, "0");
            const s = String(date.getSeconds()).padStart(2, "0");
            return `${day} ${month} ${year} ${h}:${m}:${s}`;
        }

        function changeTime(deltaSeconds) {
            const target = Math.max(startTime.getTime(), Math.min(stopTime.getTime(), currentTime.getTime() + deltaSeconds * 1000));
            currentTime = new Date(target);
            if (currentTime >= stopTime && isPlaying) togglePlay();
            updateFrame();
        }

        function togglePlay() {
            const button = document.getElementById("btnPlay");
            if (isPlaying) {
                clearInterval(playTimer);
                playTimer = null;
                isPlaying = false;
                button.textContent = "播放";
                button.classList.remove("danger");
                button.classList.add("success");
                return;
            }
            if (currentTime >= stopTime) currentTime = new Date(startTime);
            isPlaying = true;
            button.textContent = "停止";
            button.classList.remove("success");
            button.classList.add("danger");
            playTimer = setInterval(() => changeTime(5), 100);
        }

        function updateFrame() {
            document.getElementById("timeDisplay").textContent = formatDate(currentTime);
            document.getElementById("timeSlider").value = String((currentTime - startTime) / 1000);
            updateSatellites();
            updateCurrentRoutes();
            draw();
        }

        // ============================== CSV 文件与多流解析 ==============================
        // 文件名示例：Calculated_step0001_27_Feb_2025_00_00_00_000000000.csv。
        function extractTimeFromFilename(filename) {
            const match = filename.match(/_(\d{1,2})_([A-Za-z]{3})_(\d{4})_(\d{2})_(\d{2})_(\d{2})_(\d+)/);
            if (!match) return null;
            const monthNames = { jan: 0, feb: 1, mar: 2, apr: 3, may: 4, jun: 5, jul: 6, aug: 7, sep: 8, oct: 9, nov: 10, dec: 11 };
            const month = monthNames[match[2].toLowerCase()];
            if (month === undefined) return null;
            return new Date(Number(match[3]), month, Number(match[1]), Number(match[4]), Number(match[5]), Number(match[6]), Number(match[7].slice(0, 3)) || 0);
        }

        // 不能简单用 split(',')，因为标准 CSV 允许路径字段被双引号包围且内部包含逗号。
        function parseCSVRows(text) {
            const rows = [];
            let row = [], cell = "", quoted = false;
            for (let i = 0; i < text.length; i++) {
                const char = text[i];
                if (char === '"') {
                    if (quoted && text[i + 1] === '"') { cell += '"'; i++; }
                    else quoted = !quoted;
                } else if (char === "," && !quoted) {
                    row.push(cell); cell = "";
                } else if ((char === "\n" || char === "\r") && !quoted) {
                    if (char === "\r" && text[i + 1] === "\n") i++;
                    row.push(cell); cell = "";
                    if (row.some(value => value.trim() !== "")) rows.push(row);
                    row = [];
                } else cell += char;
            }
            row.push(cell);
            if (row.some(value => value.trim() !== "")) rows.push(row);
            return rows;
        }

        function normalizeHeader(value) { return value.replace(/^\uFEFF/, "").trim().toLowerCase(); }
        function findColumn(headers, names) { return headers.findIndex(header => names.includes(normalizeHeader(header))); }

        function normalizeEndpointName(value) {
            return String(value || "").trim().toLowerCase().replace(/[^a-z0-9\u4e00-\u9fff]/g, "");
        }

        function isGroundStationPairVisible(pairName) {
            return groundStationPairVisibility.get(pairName) !== false;
        }

        function isGroundStationVisible(station) {
            return Boolean(station && showGroundStations && isGroundStationPairVisible(station.pairName));
        }

        function renderGroundStationControls() {
            const list = document.getElementById("groundStationPairList");
            const stationsByPair = new Map();
            groundStations.forEach(gs => {
                if (!stationsByPair.has(gs.pairName)) stationsByPair.set(gs.pairName, []);
                stationsByPair.get(gs.pairName).push(gs);
            });
            list.innerHTML = Array.from(stationsByPair, ([pairName, stations]) => {
                const checked = isGroundStationPairVisible(pairName) ? "checked" : "";
                const endpoints = stations.map(gs => `${gs.role}: ${gs.name}`).join(" · ");
                return `<div class="ground-pair-item">
                    <label class="ground-pair-label">
                        <input class="ground-pair-toggle" type="checkbox" data-pair-name="${escapeHTML(pairName)}" ${checked}>
                        <span>${escapeHTML(pairName)}</span>
                    </label>
                    <div class="ground-pair-stations">${escapeHTML(endpoints)}</div>
                </div>`;
            }).join("");
            document.getElementById("groundStationControls").classList.toggle("disabled", !showGroundStations);
        }

        function parseGroundStationConfig(text) {
            const rows = parseCSVRows(text);
            if (rows.length < 2) throw new Error("地面站 CSV 没有数据行");
            const headers = rows[0];
            const pairColumn = findColumn(headers, ["pair_name", "pairname", "pair"]);
            const roleColumn = findColumn(headers, ["role", "endpoint", "station_role"]);
            const nameColumn = findColumn(headers, ["station_name", "ground_station_name", "name"]);
            const latColumn = findColumn(headers, ["latitude_deg", "lat_deg", "latitude", "lat"]);
            const lonColumn = findColumn(headers, ["longitude_deg", "lon_deg", "longitude", "lon"]);
            const aliasColumn = findColumn(headers, ["aliases", "alias"]);
            if ([pairColumn, roleColumn, nameColumn, latColumn, lonColumn].some(index => index < 0)) {
                throw new Error("缺少 pair_name、role、station_name、latitude_deg 或 longitude_deg 列");
            }

            const stations = [];
            const endpointKeys = new Set();
            rows.slice(1).forEach((row, rowIndex) => {
                if (row.every(value => String(value || "").trim() === "")) return;
                const pairName = String(row[pairColumn] || "").trim();
                const role = String(row[roleColumn] || "").trim();
                const name = String(row[nameColumn] || "").trim();
                const latText = String(row[latColumn] ?? "").trim();
                const lonText = String(row[lonColumn] ?? "").trim();
                const latDeg = Number(latText);
                const lonDeg = Number(lonText);
                if (!pairName || !role || !name || !latText || !lonText || !Number.isFinite(latDeg) || !Number.isFinite(lonDeg)) {
                    throw new Error(`第 ${rowIndex + 2} 行字段不完整`);
                }
                if (latDeg < -90 || latDeg > 90 || lonDeg < -180 || lonDeg > 180) {
                    throw new Error(`第 ${rowIndex + 2} 行经纬度超出范围`);
                }
                const endpointKey = `${pairName}\u0000${role}`;
                if (endpointKeys.has(endpointKey)) throw new Error(`地面站对 ${pairName} 的角色 ${role} 重复`);
                endpointKeys.add(endpointKey);
                const aliases = aliasColumn >= 0
                    ? String(row[aliasColumn] || "").split(/[;|]/).map(value => value.trim()).filter(Boolean)
                    : [];
                stations.push({ pairName, role, name, aliases, latDeg, lonDeg });
            });
            if (!stations.length) throw new Error("地面站 CSV 中没有有效站点");
            const endpointNames = new Map();
            stations.forEach(gs => [gs.name, ...gs.aliases].forEach(value => {
                const normalized = normalizeEndpointName(value);
                if (!normalized) return;
                if (endpointNames.has(normalized)) {
                    throw new Error(`端点名称或别名 ${value} 与 ${endpointNames.get(normalized)} 重复`);
                }
                endpointNames.set(normalized, gs.name);
            }));
            const pairCounts = new Map();
            stations.forEach(gs => pairCounts.set(gs.pairName, (pairCounts.get(gs.pairName) || 0) + 1));
            const incomplete = Array.from(pairCounts).filter(([, count]) => count < 2).map(([pairName]) => pairName);
            if (incomplete.length) throw new Error(`以下地面站对不足两个端点：${incomplete.join("、")}`);
            return stations;
        }

        async function loadGroundStationFile(file) {
            const status = document.getElementById("groundStationStatus");
            if (!file) return;
            try {
                const stations = parseGroundStationConfig(await file.text());
                groundStations = stations;
                prepareGroundStations(groundStations, true);
                renderGroundStationControls();
                hoveredObject = null;
                tooltip.style.display = "none";
                status.textContent = `已载入 ${groundStationPairVisibility.size} 对、${groundStations.length} 个地面站。`;
                status.style.color = "#16a34a";
                draw();
            } catch (error) {
                status.textContent = `载入失败：${error.message}`;
                status.style.color = "#dc2626";
            } finally {
                document.getElementById("groundStationFileInput").value = "";
            }
        }

        function parseSatelliteId(value) {
            const match = String(value || "").trim().match(/^(?:STARLINK[_-]?)?(\d+)$/i);
            return match ? Number(match[1]) : null;
        }

        // 从相对目录优先识别 flow_000；若 CSV 自带 FlowID 列，则以该列为准。
        function inferFlowId(file, row, flowColumn, rowIndex) {
            if (flowColumn >= 0 && row[flowColumn] !== undefined && row[flowColumn].trim() !== "") {
                const explicitFlowId = row[flowColumn].trim();
                // 将 CSV 中的 000、00 等纯数字编号统一成 "0"，保证它能与目录名 flow_000
                // 推断出的编号以及其他方法中的 FlowID=0 对齐；非数字业务编号保持原样。
                return /^\d+$/.test(explicitFlowId) ? String(Number(explicitFlowId)) : explicitFlowId;
            }
            const relativePath = file.webkitRelativePath || file.name;
            const folderMatch = relativePath.match(/(?:^|[\\/])flow[_-]?(\d+)/i);
            if (folderMatch) return String(Number(folderMatch[1]));
            const nameMatch = file.name.match(/flow[_-]?(\d+)/i);
            if (nameMatch) return String(Number(nameMatch[1]));
            // 一个文件有多行但没有 FlowID 时，每一行视为独立流。对于原页面的单流时间序列，
            // 去掉 step 和时间后缀，使多个时刻的 Calculated_stepXXXX_*.csv 能聚合为同一条流。
            const stableFileKey = file.name
                .replace(/_?step\d+/i, "")
                .replace(/_\d{1,2}_[A-Za-z]{3}_\d{4}_\d{2}_\d{2}_\d{2}_\d+.*$/i, "")
                .replace(/\.csv$/i, "") || "default";
            return rowIndex > 0 ? `${stableFileKey}#${rowIndex + 1}` : stableFileKey;
        }

        // 方法名优先使用用户输入；未输入时，取 flow_000 目录的直接上级目录。
        // 例如 results/MAPPO/flow_000/a.csv 会识别为 MAPPO，用户因此既可以逐个选择方法目录，
        // 也可以一次选择包含多个方法的 results 总目录。浏览器未提供相对路径时使用本批次兜底名称。
        function inferMethodId(file, methodNameOverride, fallbackMethodName) {
            if (methodNameOverride) return methodNameOverride;
            const relativePath = String(file.webkitRelativePath || "").replace(/\\/g, "/");
            const parts = relativePath.split("/").filter(Boolean);
            const flowDirectoryIndex = parts.findIndex(part => /^flow[_-]?\d+$/i.test(part));
            if (flowDirectoryIndex > 0) return parts[flowDirectoryIndex - 1];
            return fallbackMethodName;
        }

        function parseRouteFile(file, text, methodNameOverride, fallbackMethodName) {
            const timestamp = extractTimeFromFilename(file.name);
            if (!timestamp) return [];
            const rows = parseCSVRows(text);
            if (rows.length < 2) return [];
            const headers = rows[0];
            const pathColumn = findColumn(headers, ["path", "route"]);
            const sourceColumn = findColumn(headers, ["sourcegs", "source", "src"]);
            const targetColumn = findColumn(headers, ["targetgs", "target", "destination", "dest", "dst"]);
            const flowColumn = findColumn(headers, ["flowid", "flow_id", "flow"]);
            if (pathColumn < 0) return [];

            return rows.slice(1).map((row, rowIndex) => {
                const rawPath = String(row[pathColumn] || "").replace(/^['"]|['"]$/g, "").trim();
                const outage = rawPath.toUpperCase() === "OUTAGE" || rawPath === "";
                const ids = outage ? [] : Array.from(rawPath.matchAll(/STARLINK[_-]?(\d+)/gi), match => Number(match[1]));
                return {
                    methodId: inferMethodId(file, methodNameOverride, fallbackMethodName),
                    flowId: inferFlowId(file, row, flowColumn, rowIndex),
                    timestamp: timestamp.getTime(),
                    ids,
                    outage,
                    source: sourceColumn >= 0 ? String(row[sourceColumn] || "").trim() : "",
                    target: targetColumn >= 0 ? String(row[targetColumn] || "").trim() : "",
                    fileName: file.name
                };
            });
        }

        async function loadRouteFiles(fileList) {
            const files = Array.from(fileList).filter(file => file.name.toLowerCase().endsWith(".csv"));
            const status = document.getElementById("loadingStatus");
            if (!files.length) { status.textContent = "未找到 CSV 文件。"; return; }
            status.textContent = `正在解析 ${files.length} 个文件…`;

            // 每次选择文件只读取一次输入框，确保同一批文件不会因解析期间用户修改文本而被分到不同方法。
            const methodNameOverride = document.getElementById("methodNameInput").value.trim();
            const fallbackMethodName = `方法 ${++importBatchNumber}`;
            const parsedGroups = await Promise.all(files.map(async file =>
                parseRouteFile(file, await file.text(), methodNameOverride, fallbackMethodName)
            ));
            const records = parsedGroups.flat();
            if (!records.length) {
                status.textContent = "CSV 中未找到可解析的路径记录，请检查文件名时间戳与 Path/Route 列。";
                return;
            }

            // 同一次选择可以包含多个方法。对于本批次出现的方法采用整批替换语义，
            // 这样用户重新选择某个方法目录时不会把旧时序记录重复追加一遍。
            const recordsByMethod = new Map();
            records.forEach(record => {
                const methodId = String(record.methodId);
                if (!recordsByMethod.has(methodId)) recordsByMethod.set(methodId, []);
                recordsByMethod.get(methodId).push(record);
            });

            recordsByMethod.forEach((methodRecords, methodId) => {
                const previousMethod = methodMap.get(methodId);
                const previousVisibility = new Map(previousMethod
                    ? Array.from(previousMethod.flows, ([id, flow]) => [id, flow.visible])
                    : []);
                const flows = new Map();
                methodRecords.forEach(record => {
                    const flowId = String(record.flowId);
                    if (!flows.has(flowId)) {
                        const colorIndex = flows.size % FLOW_COLORS.length;
                        flows.set(flowId, {
                            id: flowId,
                            label: /^\d+$/.test(flowId) ? `流 ${flowId}` : flowId,
                            color: FLOW_COLORS[colorIndex],
                            visible: previousVisibility.get(flowId) ?? true,
                            timeline: [],
                            current: null
                        });
                    }
                    flows.get(flowId).timeline.push(record);
                });
                flows.forEach(flow => flow.timeline.sort((a, b) => a.timestamp - b.timestamp));

                const methodColorIndex = previousMethod ? previousMethod.colorIndex : methodMap.size % FLOW_COLORS.length;
                methodMap.set(methodId, {
                    id: methodId,
                    label: methodId,
                    flows,
                    colorIndex: methodColorIndex,
                    color: previousMethod ? previousMethod.color : FLOW_COLORS[methodColorIndex],
                    comparisonVisible: previousMethod ? previousMethod.comparisonVisible : true
                });
                activeMethodId = methodId;
            });

            flowMap = methodMap.get(activeMethodId).flows;
            status.textContent = `本次载入 ${recordsByMethod.size} 个方法、${records.length} 条时序记录；当前共 ${methodMap.size} 个方法。`;
            updateCurrentRoutes();
            updateConstellationCompatibility();
            renderMethodControls();
            renderComparisonControls();
            renderFlowList();
            draw();
            // 允许选择同一个目录后再次触发 change，便于原地刷新计算结果。
            document.getElementById("folderInput").value = "";
        }

        function updateCurrentRoutes() {
            const timestamp = currentTime.getTime();
            methodMap.forEach(method => method.flows.forEach(flow => {
                    // 二分查找不晚于当前时刻的最后一条记录，文件很多时比逐条扫描稳定。
                    let low = 0, high = flow.timeline.length - 1, best = null;
                    while (low <= high) {
                        const middle = (low + high) >> 1;
                        if (flow.timeline[middle].timestamp <= timestamp) { best = flow.timeline[middle]; low = middle + 1; }
                        else high = middle - 1;
                    }
                    flow.current = best;
                }));
            renderFlowList();
            renderComparisonList();
        }

        function escapeHTML(value) {
            return String(value).replace(/[&<>"]/g, char => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[char]));
        }

        function compareFlowIds(a, b) {
            // 纯数字流编号按数值排序，其他名称按中文自然排序，避免出现 1、10、2 的反直觉顺序。
            if (/^\d+$/.test(a) && /^\d+$/.test(b)) return Number(a) - Number(b);
            return String(a).localeCompare(String(b), "zh-CN", { numeric: true });
        }

        function renderMethodControls() {
            const section = document.getElementById("methodSection");
            const select = document.getElementById("activeMethodSelect");
            section.hidden = !methodMap.size;
            document.getElementById("methodCount").textContent = methodMap.size ? `(${methodMap.size})` : "";
            if (!methodMap.size) { select.innerHTML = ""; return; }
            select.innerHTML = Array.from(methodMap.values()).map(method =>
                `<option value="${escapeHTML(method.id)}" ${method.id === activeMethodId ? "selected" : ""}>` +
                `${escapeHTML(method.label)}（${method.flows.size} 条流）</option>`
            ).join("");
        }

        function setActiveMethod(methodId) {
            const method = methodMap.get(String(methodId));
            if (!method) return;
            activeMethodId = method.id;
            flowMap = method.flows;
            renderFlowList();
            draw();
        }

        function renderComparisonControls() {
            const section = document.getElementById("comparisonSection");
            const toggle = document.getElementById("comparisonToggle");
            const select = document.getElementById("comparisonFlowSelect");
            section.hidden = !methodMap.size;
            toggle.disabled = methodMap.size < 2;

            // 取所有方法流编号的并集；某方法缺少所选流时仍保留该方法卡片并明确显示“未包含该流”。
            const flowIds = new Set();
            methodMap.forEach(method => method.flows.forEach((_flow, flowId) => flowIds.add(flowId)));
            const sortedFlowIds = Array.from(flowIds).sort(compareFlowIds);
            if (!sortedFlowIds.includes(comparisonState.flowId)) comparisonState.flowId = sortedFlowIds[0] || "";
            select.innerHTML = sortedFlowIds.map(flowId => {
                let methodCount = 0;
                methodMap.forEach(method => { if (method.flows.has(flowId)) methodCount++; });
                const label = /^\d+$/.test(flowId) ? `流 ${flowId}` : flowId;
                return `<option value="${escapeHTML(flowId)}" ${flowId === comparisonState.flowId ? "selected" : ""}>` +
                    `${escapeHTML(label)}（${methodCount}/${methodMap.size} 个方法）</option>`;
            }).join("");

            if (methodMap.size < 2) {
                comparisonState.enabled = false;
                toggle.checked = false;
            } else toggle.checked = comparisonState.enabled;
            renderComparisonList();
        }

        function routeSignature(route) {
            if (!route) return "NO_DATA";
            if (route.outage) return "OUTAGE";
            return route.ids.join(">");
        }

        function renderComparisonList() {
            const list = document.getElementById("comparisonList");
            const summary = document.getElementById("comparisonSummary");
            if (!methodMap.size || !comparisonState.flowId) {
                list.innerHTML = "";
                summary.textContent = "载入路径数据后可选择要对比的流。";
                return;
            }

            const rows = Array.from(methodMap.values()).map(method => ({
                method,
                flow: method.flows.get(comparisonState.flowId) || null
            }));
            const validSignatures = new Set(rows
                .map(row => row.flow ? routeSignature(row.flow.current) : "NO_FLOW")
                .filter(signature => signature !== "NO_DATA" && signature !== "NO_FLOW"));
            const availableCount = rows.filter(row => row.flow && row.flow.current).length;
            const outageCount = rows.filter(row => row.flow && row.flow.current && row.flow.current.outage).length;

            if (methodMap.size < 2) {
                summary.textContent = "至少载入两个方法后即可叠加对比；当前可先检查该方法的路径明细。";
            } else {
                const differenceText = validSignatures.size <= 1 ? "当前有效路径一致" : `发现 ${validSignatures.size} 种不同路径`;
                summary.textContent = `${availableCount}/${methodMap.size} 个方法在当前时刻有记录，${differenceText}` +
                    (outageCount ? `，其中 ${outageCount} 个 OUTAGE。` : "。");
            }

            let referenceSignature = null;
            for (const row of rows) {
                const route = row.flow && row.flow.current;
                if (route && !route.outage) { referenceSignature = routeSignature(route); break; }
            }

            list.innerHTML = rows.map(({ method, flow }) => {
                const route = flow && flow.current;
                let stateText = "未包含该流", stateClass = "status-outage", pathText = "—";
                if (flow && !route) {
                    stateText = "当前时刻无数据";
                } else if (route && route.outage) {
                    stateText = "OUTAGE";
                    pathText = "OUTAGE";
                } else if (route) {
                    const isSame = referenceSignature === routeSignature(route);
                    stateText = `${Math.max(0, route.ids.length - 1)} 跳 · ${isSame ? "与基准相同" : "与基准不同"}`;
                    stateClass = isSame ? "status-same" : "status-different";
                    pathText = route.ids.map(id => `STARLINK_${id}`).join(" → ");
                }
                return `<div class="comparison-item" style="--method-color:${method.color}">
                    <div class="comparison-main">
                        <input class="comparison-visible" type="checkbox" data-method-id="${escapeHTML(method.id)}"
                            ${method.comparisonVisible ? "checked" : ""} aria-label="显示${escapeHTML(method.label)}的对比路径">
                        <input class="flow-color comparison-color" type="color" data-method-id="${escapeHTML(method.id)}"
                            value="${method.color}" aria-label="${escapeHTML(method.label)}的对比颜色">
                        <span class="comparison-name" title="${escapeHTML(method.label)}">${escapeHTML(method.label)}</span>
                        <span class="${stateClass}">${stateText}</span>
                    </div>
                    <div class="comparison-path" title="${escapeHTML(pathText)}">${escapeHTML(pathText)}</div>
                </div>`;
            }).join("");
        }

        function setMethodComparisonVisible(methodId, visible) {
            const method = methodMap.get(String(methodId));
            if (method) { method.comparisonVisible = visible; draw(); }
        }

        function setMethodComparisonColor(methodId, color) {
            const method = methodMap.get(String(methodId));
            if (method) { method.color = color; renderComparisonList(); draw(); }
        }

        function clearLoadedMethods() {
            if (methodMap.size && !confirm("确定清空所有已载入的方法和路径吗？")) return;
            methodMap = new Map();
            flowMap = new Map();
            activeMethodId = "";
            comparisonState.enabled = false;
            comparisonState.flowId = "";
            document.getElementById("loadingStatus").textContent = "已清空路径数据。";
            renderMethodControls();
            renderComparisonControls();
            renderFlowList();
            updateConstellationCompatibility();
            draw();
        }

        function renderFlowList() {
            const list = document.getElementById("flowList");
            document.getElementById("flowCount").textContent = flowMap.size ? `(${flowMap.size})` : "";
            if (!flowMap.size) { list.innerHTML = '<div class="empty">尚未载入路径数据</div>'; return; }
            list.innerHTML = Array.from(flowMap.values()).map(flow => {
                const route = flow.current;
                const stateClass = route && !route.outage ? "" : "outage";
                const stateText = !route ? "暂无数据" : route.outage ? "OUTAGE" : `${route.ids.length} 星 / ${Math.max(0, route.ids.length - 1)} 跳`;
                const endpoints = route ? `${route.source || "?"} → ${route.target || "?"}` : "当前时间之前没有记录";
                return `<div class="flow-item"><div class="flow-main">
                    <input type="checkbox" ${flow.visible ? "checked" : ""} aria-label="显示${escapeHTML(flow.label)}" onchange="setFlowVisible('${escapeHTML(flow.id)}', this.checked)">
                    <input class="flow-color" type="color" value="${flow.color}" aria-label="${escapeHTML(flow.label)}颜色" onchange="setFlowColor('${escapeHTML(flow.id)}', this.value)">
                    <span class="flow-name" title="${escapeHTML(flow.label)}">${escapeHTML(flow.label)}</span>
                    <span class="flow-state ${stateClass}">${stateText}</span>
                </div><div class="flow-detail" title="${escapeHTML(endpoints)}">${escapeHTML(endpoints)}</div></div>`;
            }).join("");
        }

        function setFlowVisible(id, visible) { const flow = flowMap.get(String(id)); if (flow) { flow.visible = visible; draw(); } }
        function setFlowColor(id, color) { const flow = flowMap.get(String(id)); if (flow) { flow.color = color; draw(); } }
        function setAllFlowsVisible(visible) { flowMap.forEach(flow => { flow.visible = visible; }); renderFlowList(); draw(); }

        // ============================== 星座位置计算 ==============================
        function getGMST(date) {
            const julianDate = date.getTime() / 86400000 + 2440587.5;
            const daysSinceJ2000 = julianDate - 2451545.0;
            let degrees = (280.46061837 + 360.98564736629 * daysSinceJ2000) % 360;
            if (degrees < 0) degrees += 360;
            return degrees * Math.PI / 180 + 2.095;
        }

        function updateSatellites() {
            const elapsedSeconds = (currentTime - startTime) / 1000;
            const earthAngle = getGMST(startTime) + EARTH_ROTATION * elapsedSeconds;
            const inclination = constellation.inclinationDeg * Math.PI / 180;
            const semiMajorAxis = EARTH_RADIUS_KM + constellation.altitudeKm;
            const meanMotion = Math.sqrt(EARTH_MU / Math.pow(semiMajorAxis, 3));
            const planes = constellation.planes;
            const satsPerPlane = constellation.satsPerPlane;
            satellites = [];
            const total = planes * satsPerPlane;
            for (let plane = 0; plane < planes; plane++) {
                const raan = 2 * Math.PI * plane / planes;
                const phase = plane * constellation.phaseFactor * 2 * Math.PI / total;
                for (let index = 0; index < satsPerPlane; index++) {
                    const anomaly = index * 2 * Math.PI / satsPerPlane + phase + meanMotion * elapsedSeconds;
                    const xOrbital = Math.cos(anomaly), yOrbital = Math.sin(anomaly);
                    const xEci = xOrbital * Math.cos(raan) - yOrbital * Math.cos(inclination) * Math.sin(raan);
                    const yEci = xOrbital * Math.sin(raan) + yOrbital * Math.cos(inclination) * Math.cos(raan);
                    const zEci = yOrbital * Math.sin(inclination);
                    const xEcef = xEci * Math.cos(earthAngle) + yEci * Math.sin(earthAngle);
                    const yEcef = -xEci * Math.sin(earthAngle) + yEci * Math.cos(earthAngle);
                    satellites.push({ id: plane * satsPerPlane + index + 1, plane, index, lat: Math.asin(zEci), lon: Math.atan2(yEcef, xEcef) });
                }
            }
        }

        // ============================== 连续世界坐标与绘制 ==============================
        function worldWidth() { return BASE_WORLD_WIDTH * view.scale; }
        function worldHeight() { return BASE_WORLD_HEIGHT * view.scale; }

        function getBaseScreenPos(lon, lat) {
            return {
                x: (lon + Math.PI) / (2 * Math.PI) * worldWidth() + view.offsetX,
                y: (Math.PI / 2 - lat) / Math.PI * worldHeight() + view.offsetY
            };
        }

        // 返回某个基础 x 坐标在当前窗口内所有可见的周期副本。
        function visibleCopyXs(baseX, margin = 20) {
            const period = worldWidth();
            const first = Math.ceil((-margin - baseX) / period);
            const last = Math.floor((viewportWidth + margin - baseX) / period);
            const result = [];
            for (let copy = first; copy <= last; copy++) result.push(baseX + copy * period);
            return result;
        }

        function drawTiledMap() {
            const mapW = worldWidth(), mapH = worldHeight();
            const first = Math.ceil(-view.offsetX / mapW) - 1;
            const last = Math.floor((viewportWidth - view.offsetX) / mapW) + 1;
            for (let copy = first; copy <= last; copy++) {
                const x = view.offsetX + copy * mapW;
                if (mapImage.complete && mapImage.naturalWidth) {
                    ctx.save();
                    ctx.globalAlpha = 0.43;
                    ctx.filter = "grayscale(100%) contrast(88%)";
                    ctx.drawImage(mapImage, x, view.offsetY, mapW, mapH);
                    ctx.restore();
                } else {
                    ctx.fillStyle = "#eef3f8";
                    ctx.fillRect(x, view.offsetY, mapW, mapH);
                }
                ctx.strokeStyle = "rgba(100,116,139,0.2)";
                ctx.lineWidth = 1;
                ctx.strokeRect(x, view.offsetY, mapW, mapH);
            }
        }

        // 将第二个端点解包到离第一个端点最近的世界副本，再把整条线段周期复制。
        // 这样跨越 +180°/-180° 的线不会横穿整张地图，也不会在边界处消失。
        function drawPeriodicLine(pointA, pointB, color, lineWidth, dashed = false, alpha = 1) {
            const a = getBaseScreenPos(pointA.lon, pointA.lat);
            const b = getBaseScreenPos(pointB.lon, pointB.lat);
            const period = worldWidth();
            let deltaX = b.x - a.x;
            if (deltaX > period / 2) deltaX -= period;
            else if (deltaX < -period / 2) deltaX += period;
            const unwrappedBX = a.x + deltaX;
            const minX = Math.min(a.x, unwrappedBX), maxX = Math.max(a.x, unwrappedBX);
            const first = Math.ceil((-20 - maxX) / period);
            const last = Math.floor((viewportWidth + 20 - minX) / period);

            ctx.save();
            ctx.strokeStyle = color;
            ctx.globalAlpha = alpha;
            ctx.lineWidth = lineWidth;
            ctx.lineCap = "round";
            ctx.setLineDash(dashed ? [7, 5] : []);
            ctx.beginPath();
            for (let copy = first; copy <= last; copy++) {
                const shift = copy * period;
                ctx.moveTo(a.x + shift, a.y);
                ctx.lineTo(unwrappedBX + shift, b.y);
            }
            ctx.stroke();
            ctx.restore();
        }

        function endpointPosition(name) {
            const normalizedName = normalizeEndpointName(name);
            const station = groundStations.find(gs =>
                [gs.name, ...gs.aliases].some(candidate => normalizeEndpointName(candidate) === normalizedName)
            );
            if (station) return station;
            const satId = parseSatelliteId(name);
            return satId && satellites[satId - 1] ? satellites[satId - 1] : null;
        }

        function isGroundStation(point) {
            return point ? groundStations.includes(point) : false;
        }

        function shouldDrawEndpoint(point) {
            return point ? (!isGroundStation(point) || isGroundStationVisible(point)) : false;
        }

        function displayedFlows() {
            if (!comparisonState.enabled || methodMap.size < 2 || !comparisonState.flowId) {
                return Array.from(flowMap.values());
            }

            // 对比模式下用“方法颜色”覆盖原来的“流颜色”，并构造轻量视图对象交给既有绘图函数。
            // 原始 flow 不被修改，因此关闭对比后，普通模式下用户为各流设置的颜色仍会完整保留。
            const result = [];
            methodMap.forEach(method => {
                const flow = method.flows.get(comparisonState.flowId);
                if (!method.comparisonVisible || !flow) return;
                result.push({ ...flow, color: method.color, visible: true, methodId: method.id });
            });
            return result;
        }

        function activeSatelliteColors() {
            const colors = new Map();
            displayedFlows().forEach(flow => {
                if (!flow.visible || !flow.current || flow.current.outage) return;
                flow.current.ids.forEach(id => { if (!colors.has(id)) colors.set(id, []); colors.get(id).push(flow.color); });
            });
            return colors;
        }

        function drawRoute(flow) {
            const route = flow.current;
            if (!flow.visible || !route || route.outage || !route.ids.length) return;
            const routeSats = route.ids.map(id => satellites[id - 1]).filter(Boolean);
            if (!routeSats.length) return;
            const source = endpointPosition(route.source);
            const target = endpointPosition(route.target);
            // 关闭地面站显示时，也隐藏连接地面站和卫星的虚线；卫星到卫星的路径不受影响。
            if (source && source !== routeSats[0] && shouldDrawEndpoint(source)) {
                drawPeriodicLine(source, routeSats[0], flow.color, 2, true, 0.9);
            }
            for (let i = 0; i < routeSats.length - 1; i++) drawPeriodicLine(routeSats[i], routeSats[i + 1], flow.color, 3, false, 0.95);
            if (target && target !== routeSats[routeSats.length - 1] && shouldDrawEndpoint(target)) {
                drawPeriodicLine(routeSats[routeSats.length - 1], target, flow.color, 2, true, 0.9);
            }
        }

        function drawGroundStations() {
            if (!showGroundStations) return;
            groundStations.filter(isGroundStationVisible).forEach(gs => {
                const position = getBaseScreenPos(gs.lon, gs.lat);
                visibleCopyXs(position.x, 30).forEach(x => {
                    if (position.y < -30 || position.y > viewportHeight + 30) return;
                    ctx.beginPath();
                    ctx.moveTo(x, position.y - 9); ctx.lineTo(x - 9, position.y + 9); ctx.lineTo(x + 9, position.y + 9); ctx.closePath();
                    ctx.fillStyle = "#dc2626"; ctx.fill();
                    ctx.fillStyle = "#334155"; ctx.font = "600 11px Segoe UI"; ctx.fillText(gs.name, x + 11, position.y + 4);
                });
            });
        }

        function drawSatellites() {
            const activeColors = activeSatelliteColors();
            satellites.forEach(sat => {
                const position = getBaseScreenPos(sat.lon, sat.lat);
                visibleCopyXs(position.x, 12).forEach(x => {
                    if (position.y < -12 || position.y > viewportHeight + 12) return;
                    const colors = activeColors.get(sat.id);
                    const active = colors && colors.length;
                    ctx.beginPath(); ctx.arc(x, position.y, active ? 4.5 : 2.2, 0, Math.PI * 2);
                    ctx.fillStyle = active ? colors[0] : "rgba(30,41,59,0.78)"; ctx.fill();
                    if (active) {
                        ctx.beginPath(); ctx.arc(x, position.y, 7.5, 0, Math.PI * 2);
                        ctx.strokeStyle = colors.length > 1 ? "#ffffff" : colors[0]; ctx.globalAlpha = 0.7; ctx.lineWidth = 1.5; ctx.stroke(); ctx.globalAlpha = 1;
                    }
                });
            });
        }

        function drawSearchMarker() {
            const sat = searchedSatId ? satellites[searchedSatId - 1] : null;
            if (!sat) return;
            const position = getBaseScreenPos(sat.lon, sat.lat);
            visibleCopyXs(position.x, 18).forEach(x => {
                ctx.beginPath(); ctx.arc(x, position.y, 13, 0, Math.PI * 2);
                ctx.strokeStyle = "#f59e0b"; ctx.lineWidth = 2.5; ctx.stroke();
                ctx.beginPath(); ctx.moveTo(x - 17, position.y); ctx.lineTo(x + 17, position.y); ctx.moveTo(x, position.y - 17); ctx.lineTo(x, position.y + 17); ctx.lineWidth = 1.5; ctx.stroke();
            });
        }

        function drawEndpointMarker(point, color, kind) {
            if (!point) return;
            const position = getBaseScreenPos(point.lon, point.lat);
            visibleCopyXs(position.x, 14).forEach(x => {
                if (position.y < -14 || position.y > viewportHeight + 14) return;
                ctx.save();
                ctx.fillStyle = color;
                ctx.strokeStyle = "#ffffff";
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                if (kind === "source") {
                    // 源端点使用向上的三角形，与原页面的地面站图形保持直观一致。
                    ctx.moveTo(x, position.y - 9);
                    ctx.lineTo(x - 8, position.y + 7);
                    ctx.lineTo(x + 8, position.y + 7);
                    ctx.closePath();
                } else {
                    // 宿端点使用菱形；即使源和宿都是卫星，仍可一眼区分方向。
                    ctx.moveTo(x, position.y - 9);
                    ctx.lineTo(x + 9, position.y);
                    ctx.lineTo(x, position.y + 9);
                    ctx.lineTo(x - 9, position.y);
                    ctx.closePath();
                }
                ctx.fill();
                ctx.stroke();
                ctx.restore();
            });
        }

        function drawFlowEndpoints() {
            displayedFlows().forEach(flow => {
                if (!flow.visible || !flow.current || flow.current.outage) return;
                const route = flow.current;
                // CSV 端点为空时退回路径首尾卫星，保证任意合法 Path 都能显示源/宿标记。
                const source = endpointPosition(route.source) || satellites[route.ids[0] - 1];
                const target = endpointPosition(route.target) || satellites[route.ids[route.ids.length - 1] - 1];
                if (shouldDrawEndpoint(source)) drawEndpointMarker(source, flow.color, "source");
                if (shouldDrawEndpoint(target)) drawEndpointMarker(target, flow.color, "target");
            });
        }

        function draw() {
            ctx.setTransform(deviceScale, 0, 0, deviceScale, 0, 0);
            ctx.clearRect(0, 0, viewportWidth, viewportHeight);
            ctx.fillStyle = "#f8fafc"; ctx.fillRect(0, 0, viewportWidth, viewportHeight);
            drawTiledMap();

            // 背景轨道链路同样采用周期线段，所以蓝色网格也不会在日期变更线断开。
            satellites.forEach(sat => {
                const satsPerPlane = constellation.satsPerPlane;
                const next = satellites[sat.plane * satsPerPlane + (sat.index + 1) % satsPerPlane];
                drawPeriodicLine(sat, next, "#3b82f6", 0.7, false, 0.13);
            });
            displayedFlows().forEach(drawRoute);
            drawGroundStations();
            drawSatellites();
            drawFlowEndpoints();
            drawSearchMarker();
        }

        // ============================== 鼠标、缩放与命中检测 ==============================
        function normalizeHorizontalOffset() {
            // 平移很久后将偏移归一到一个世界宽度内，避免浮点数无限增大；画面不会跳变。
            const period = worldWidth();
            view.offsetX = ((view.offsetX % period) + period) % period - period;
        }

        function resize() {
            deviceScale = Math.max(1, window.devicePixelRatio || 1);
            viewportWidth = window.innerWidth;
            viewportHeight = window.innerHeight;
            canvas.width = Math.round(viewportWidth * deviceScale);
            canvas.height = Math.round(viewportHeight * deviceScale);
            canvas.style.width = `${viewportWidth}px`;
            canvas.style.height = `${viewportHeight}px`;
            draw();
        }

        function nearestPeriodicX(baseX, pointerX) {
            const period = worldWidth();
            return baseX + Math.round((pointerX - baseX) / period) * period;
        }

        function hitTest(pointerX, pointerY) {
            if (showGroundStations) {
                for (const gs of groundStations.filter(isGroundStationVisible)) {
                    const position = getBaseScreenPos(gs.lon, gs.lat);
                    const x = nearestPeriodicX(position.x, pointerX);
                    if (Math.hypot(pointerX - x, pointerY - position.y) <= 13) return { type: "GS", object: gs, x, y: position.y };
                }
            }
            let nearest = null, nearestDistance = 10;
            for (const sat of satellites) {
                const position = getBaseScreenPos(sat.lon, sat.lat);
                const x = nearestPeriodicX(position.x, pointerX);
                const distance = Math.hypot(pointerX - x, pointerY - position.y);
                if (distance < nearestDistance) { nearestDistance = distance; nearest = { type: "SAT", object: sat, x, y: position.y }; }
            }
            return nearest;
        }

        function updateTooltip(event) {
            hoveredObject = hitTest(event.clientX, event.clientY);
            if (!hoveredObject) { tooltip.style.display = "none"; return; }
            tooltip.style.display = "block";
            tooltip.style.left = `${event.clientX + 14}px`;
            tooltip.style.top = `${event.clientY + 14}px`;
            if (hoveredObject.type === "GS") {
                const gs = hoveredObject.object;
                tooltip.innerHTML = `<strong>${escapeHTML(gs.name)}</strong><br>` +
                    `${escapeHTML(gs.pairName)} · ${escapeHTML(gs.role)}<br>` +
                    `经度 ${gs.lonDeg.toFixed(2)}° · 纬度 ${gs.latDeg.toFixed(2)}°`;
            } else {
                const sat = hoveredObject.object;
                tooltip.innerHTML = `<strong>STARLINK_${sat.id}</strong><br>轨道面 ${sat.plane} · 面内编号 ${sat.index}`;
            }
        }

        function doSearch() {
            const id = parseSatelliteId(document.getElementById("inpSearch").value);
            if (!id || id < 1 || id > satellites.length) {
                searchedSatId = null;
                alert(`当前构型请输入 1 到 ${constellationTotal()} 之间的卫星编号。`);
            }
            else searchedSatId = id;
            draw();
        }

        // ============================== 服务器目录浏览 ==============================
        // 浏览器原生文件选择器只能访问客户端文件系统。这里通过同源 API 浏览由
        // serve_webui.py 明确授权的数据根目录，并把返回内容包装成现有解析器所需的 File 接口。
        let browsingServerDirectory = "";

        async function requestJSON(url, options) {
            const response = await fetch(url, options);
            let payload;
            try { payload = await response.json(); }
            catch (_) { throw new Error("服务器未返回有效的 JSON；请确认页面由 serve_webui.py 提供"); }
            if (!response.ok) throw new Error(payload.error || `HTTP ${response.status}`);
            return payload;
        }

        async function browseServerDirectory(path = "") {
            const status = document.getElementById("loadingStatus");
            const list = document.getElementById("serverDirectoryList");
            list.innerHTML = '<div class="empty">正在读取服务器目录…</div>';
            try {
                const payload = await requestJSON(`/api/directories?path=${encodeURIComponent(path)}`);
                browsingServerDirectory = payload.current;
                document.getElementById("serverDirectoryCurrent").textContent = payload.current;
                const entries = [];
                if (payload.parent) entries.push({ name: "↩ 上级目录", path: payload.parent });
                entries.push(...payload.directories.map(directory => ({
                    name: `📁 ${directory.name}`,
                    path: directory.path
                })));
                list.replaceChildren();
                if (!entries.length) {
                    list.innerHTML = '<div class="empty">当前目录没有子目录</div>';
                } else {
                    entries.forEach(entry => {
                        const button = document.createElement("button");
                        button.type = "button";
                        button.className = "directory-entry";
                        button.textContent = entry.name;
                        button.addEventListener("click", () => browseServerDirectory(entry.path));
                        list.appendChild(button);
                    });
                }
            } catch (error) {
                list.innerHTML = `<div class="empty">${escapeHTML(error.message)}</div>`;
                status.textContent = `无法浏览服务器目录：${error.message}`;
                status.style.color = "#dc2626";
            }
        }

        async function openServerDirectoryDialog() {
            const dialog = document.getElementById("directoryDialog");
            if (!dialog.open) dialog.showModal();
            await browseServerDirectory(document.getElementById("serverDirectoryPath").value);
        }

        function selectCurrentServerDirectory() {
            if (!browsingServerDirectory) return;
            document.getElementById("serverDirectoryPath").value = browsingServerDirectory;
            document.getElementById("loadServerDirectoryButton").disabled = false;
            document.getElementById("directoryDialog").close();
        }

        async function loadServerRouteDirectory() {
            const path = document.getElementById("serverDirectoryPath").value;
            const status = document.getElementById("loadingStatus");
            const button = document.getElementById("loadServerDirectoryButton");
            if (!path) return;
            button.disabled = true;
            status.style.color = "#b45309";
            status.textContent = "正在从服务器读取 CSV…";
            try {
                const payload = await requestJSON("/api/route-files", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ path })
                });
                const files = payload.files.map(file => ({
                    name: file.name,
                    webkitRelativePath: file.relativePath,
                    text: async () => file.text
                }));
                await loadRouteFiles(files);
            } catch (error) {
                status.textContent = `载入服务器目录失败：${error.message}`;
                status.style.color = "#dc2626";
            } finally {
                button.disabled = false;
            }
        }

        // ============================== 初始化与事件绑定 ==============================
        document.getElementById("timeSlider").addEventListener("input", event => {
            currentTime = new Date(startTime.getTime() + Number(event.target.value) * 1000);
            updateFrame();
        });
        document.getElementById("folderInput").addEventListener("change", event => loadRouteFiles(event.target.files));
        document.getElementById("browseServerDirectoryButton").addEventListener("click", openServerDirectoryDialog);
        document.getElementById("loadServerDirectoryButton").addEventListener("click", loadServerRouteDirectory);
        document.getElementById("selectDirectoryButton").addEventListener("click", selectCurrentServerDirectory);
        document.getElementById("cancelDirectoryButton").addEventListener("click", () => document.getElementById("directoryDialog").close());
        document.getElementById("closeDirectoryDialogButton").addEventListener("click", () => document.getElementById("directoryDialog").close());
        document.getElementById("inpSearch").addEventListener("keydown", event => { if (event.key === "Enter") doSearch(); });
        document.getElementById("constellationSelect").addEventListener("change", event => applyConstellationPreset(event.target.value));
        document.getElementById("activeMethodSelect").addEventListener("change", event => setActiveMethod(event.target.value));
        document.getElementById("comparisonToggle").addEventListener("change", event => {
            comparisonState.enabled = event.target.checked && methodMap.size >= 2;
            renderComparisonList();
            draw();
        });
        document.getElementById("comparisonFlowSelect").addEventListener("change", event => {
            comparisonState.flowId = event.target.value;
            renderComparisonList();
            draw();
        });
        // 对比方法卡片会随时间和流选择整体重绘，使用事件委托可以避免每次重绘后重复绑定监听器。
        document.getElementById("comparisonList").addEventListener("change", event => {
            const methodId = event.target.dataset.methodId;
            if (!methodId) return;
            if (event.target.classList.contains("comparison-visible")) {
                setMethodComparisonVisible(methodId, event.target.checked);
            } else if (event.target.classList.contains("comparison-color")) {
                setMethodComparisonColor(methodId, event.target.value);
            }
        });
        document.getElementById("comparisonList").addEventListener("input", event => {
            if (event.target.classList.contains("comparison-color")) {
                setMethodComparisonColor(event.target.dataset.methodId, event.target.value);
            }
        });
        document.getElementById("groundStationToggle").addEventListener("change", event => {
            showGroundStations = event.target.checked;
            // 若关闭开关时鼠标正停在地面站上，需要立即清除已经显示的提示框。
            if (!showGroundStations && hoveredObject && hoveredObject.type === "GS") {
                hoveredObject = null;
                tooltip.style.display = "none";
            }
            renderGroundStationControls();
            draw();
        });
        document.getElementById("groundStationPairList").addEventListener("change", event => {
            if (!event.target.classList.contains("ground-pair-toggle")) return;
            const pairName = event.target.dataset.pairName;
            groundStationPairVisibility.set(pairName, event.target.checked);
            if (hoveredObject && hoveredObject.type === "GS" && !isGroundStationVisible(hoveredObject.object)) {
                hoveredObject = null;
                tooltip.style.display = "none";
            }
            draw();
        });
        document.getElementById("groundStationFileInput").addEventListener("change", event => {
            loadGroundStationFile(event.target.files && event.target.files[0]);
        });

        const dropZone = document.getElementById("dropZone");
        ["dragenter", "dragover"].forEach(type => dropZone.addEventListener(type, event => { event.preventDefault(); dropZone.classList.add("dragover"); }));
        ["dragleave", "drop"].forEach(type => dropZone.addEventListener(type, event => { event.preventDefault(); dropZone.classList.remove("dragover"); }));
        dropZone.addEventListener("drop", event => loadRouteFiles(event.dataTransfer.files));

        canvas.addEventListener("mousedown", event => { view.dragging = true; view.lastX = event.clientX; view.lastY = event.clientY; container.classList.add("dragging"); });
        window.addEventListener("mouseup", () => { view.dragging = false; container.classList.remove("dragging"); });
        canvas.addEventListener("mousemove", event => {
            if (view.dragging) {
                view.offsetX += event.clientX - view.lastX;
                view.offsetY += event.clientY - view.lastY;
                view.lastX = event.clientX; view.lastY = event.clientY;
                normalizeHorizontalOffset();
                draw();
            }
            updateTooltip(event);
        });
        canvas.addEventListener("mouseleave", () => { tooltip.style.display = "none"; });
        canvas.addEventListener("wheel", event => {
            event.preventDefault();
            const factor = Math.exp(event.deltaY < 0 ? 0.1 : -0.1);
            const nextScale = view.scale * factor;
            if (nextScale < 0.12 || nextScale > 40) return;
            // 以鼠标位置为缩放中心，保证用户关注的地理点留在鼠标下方。
            view.offsetX = event.clientX - (event.clientX - view.offsetX) * factor;
            view.offsetY = event.clientY - (event.clientY - view.offsetY) * factor;
            view.scale = nextScale;
            normalizeHorizontalOffset();
            draw();
        }, { passive: false });
        window.addEventListener("resize", resize);
        mapImage.addEventListener("load", draw);

        // 初始显示完整世界，并在视口中居中；之后执行时间初始化和首帧轨道计算。
        view.scale = Math.min(window.innerWidth / BASE_WORLD_WIDTH, window.innerHeight / BASE_WORLD_HEIGHT);
        view.scale = Math.max(view.scale, 0.55);
        view.offsetX = (window.innerWidth - BASE_WORLD_WIDTH * view.scale) / 2;
        view.offsetY = (window.innerHeight - BASE_WORLD_HEIGHT * view.scale) / 2;
        resize();
        renderGroundStationControls();
        renderConstellationInfo();
        updateConstellationCompatibility();
        applyTimeSettings();
    </script>
</body>

</html>
